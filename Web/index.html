<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>숭실대 실시간 캔버스 중계</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; font-family: sans-serif; }
        canvas { background: white; border: 5px solid #34495e; cursor: default; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #info { margin-top: 15px; font-size: 1.2em; color: #ecf0f1; }
    </style>
</head>
<body>
    <h1>실시간 캔버스 (교수님 화면)</h1>
    <canvas id="liveCanvas" width="800" height="600"></canvas>
    <div id="info">서버 연결 대기 중...</div>

    <script>
        const canvas = document.getElementById('liveCanvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        // --- [수정된 부분: 이전 좌표 저장 변수] ---
        let lastX = null;
        let lastY = null;
        let lastTime = Date.now(); // 마지막으로 데이터가 온 시간

        // 선 스타일 설정
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        const socket = new WebSocket('ws://localhost:8082');

        socket.onopen = () => {
            info.innerText = "🟢 서버 연결 성공! 데이터를 기다리는 중...";
            console.log("Connected to Java WebSocket Server");
        };

        socket.onmessage = (event) => {
            const data = event.data.split(',');
            const relX = parseFloat(data[0]);
            const relY = parseFloat(data[1]);
            const colorIdx = parseInt(data[2]);

            const x = relX * canvas.width;
            const y = relY * canvas.height;

            // --- [수정된 부분: 선 끊기 로직] ---
            // 0.1초(100ms) 이상 데이터가 끊겼다가 다시 오면 '새로운 선'으로 인식함
            const currentTime = Date.now();
            if (currentTime - lastTime > 100) {
                lastX = null;
                lastY = null;
            }
            lastTime = currentTime;

            // 색상 선택
            ctx.strokeStyle = (colorIdx === 0) ? "black" : "red";
            
            // --- [핵심 수정: 점이 아닌 선 긋기] ---
            if (lastX !== null && lastY !== null) {
                // 이전 좌표가 있으면 선으로 연결
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
            } else {
                // 이전 좌표가 없으면(새로운 시작) 점 하나 찍기
                ctx.beginPath();
                ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = ctx.strokeStyle;
                ctx.fill();
            }

            // 현재 좌표를 저장하여 다음 번에 이전 좌표로 사용
            lastX = x;
            lastY = y;

            info.innerText = `수신 중: X(${x.toFixed(1)}), Y(${y.toFixed(1)})`;
        };

        socket.onerror = (error) => {
            info.innerText = "🔴 연결 에러 발생!";
            console.error(error);
        };

        socket.onclose = () => {
            info.innerText = "⚪ 서버와 연결이 끊겼습니다.";
        };
    </script>
</body>
</html>
